<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
<rect x=".5" y=".5" width="759" height="339" rx="16" fill="#050505" stroke="#fff" stroke-opacity=".16"/>
<rect x=".5" y=".5" width="759" height="40" rx="16" fill="#fff" fill-opacity=".04"/>
<circle cx="26" cy="21" r="5" fill="#fff" fill-opacity=".35"/><circle cx="44" cy="21" r="5" fill="#fff" fill-opacity=".22"/><circle cx="62" cy="21" r="5" fill="#fff" fill-opacity=".12"/>
<text x="380" y="26" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" fill="#71717a">w3kiss@setup-hub: ~</text>
<g transform="translate(0,12)"><text x="34" y="88" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#fff" opacity="0">$ whoami<animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.01s" fill="freeze"/></text><text x="34" y="122" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#a1a1aa" opacity="0">w3kiss — разработчик Windows-инструментов<animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.01s" fill="freeze"/></text><text x="34" y="156" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#fff" opacity="0">$ cat now.txt<animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.01s" fill="freeze"/></text><text x="34" y="190" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#a1a1aa" opacity="0">делаю Setup Hub: установка софта, твики, USB, бэкапы<animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.01s" fill="freeze"/></text><text x="34" y="224" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#fff" opacity="0">$ stack --list<animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.01s" fill="freeze"/></text><text x="34" y="258" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#a1a1aa" opacity="0">Rust · Tauri 2 · Svelte 5 · TypeScript · PowerShell<animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.01s" fill="freeze"/></text><text x="34" y="292" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="16" fill="#fff" opacity="0">$ _<animate attributeName="opacity" from="0" to="1" begin="5.7s" dur="0.01s" fill="freeze"/></text></g>
<rect x="64" y="298" width="9" height="18" fill="#fff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
